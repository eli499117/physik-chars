name: Two-way mirror with Codeberg

on:
  # Scheduled pull-and-resync every 15 minutes.
  schedule:
    - cron: '*/15 * * * *'
  # Allow manual runs from the Actions tab.
  workflow_dispatch: {}

# Required to push (including force-with-lease) into the same repo
# from the default $GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout this GitHub repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bidirectional sync with Codeberg
        env:
          CB_REPO: ${{ vars.CB_REPO }}
          CB_TOKEN: ${{ secrets.CB_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${CB_REPO:-}" ]; then
            echo "::error::CB_REPO variable not set on this repository — see README."
            exit 1
          fi
          if [ -z "${CB_TOKEN:-}" ]; then
            echo "::error::CB_TOKEN secret not set on this repository — see README."
            exit 1
          fi

          # ---- 1. figure out GitHub's default branch ----
          GH_DEFAULT=$(git symbolic-ref --quiet --short refs/remotes/origin/HEAD 2>/dev/null | sed 's@^origin/@@' || true)
          if [ -z "$GH_DEFAULT" ]; then
            GH_DEFAULT=$(gh repo view "$GITHUB_REPOSITORY" --json defaultBranchRef -q '.defaultBranchRef.name')
          fi
          echo "GitHub default branch: $GH_DEFAULT"
          GH_SHA=$(git rev-parse "origin/$GH_DEFAULT")

          # ---- 2. wire up Codeberg credential helper and fetch ----
          git config --global credential.helper '!f() { echo username=x-access-token; echo password="$CB_TOKEN"; }; f'
          git remote remove cb 2>/dev/null || true
          git remote add cb "https://codeberg.org/${CB_REPO}.git"

          # Fetch into a separate ref namespace so we can compare without clobbering.
          git fetch cb '+refs/heads/*:refs/cb-remote/heads/*' '+refs/tags/*:refs/cb-remote/tags/*' \
            --prune --force 2>&1 | tail -5 || true

          CB_DEFAULT=""
          for guess in main master; do
            if git rev-parse --verify "refs/cb-remote/heads/$guess" >/dev/null 2>&1; then
              CB_DEFAULT=$guess
              break
            fi
          done

          if [ -n "$CB_DEFAULT" ]; then
            CB_SHA=$(git rev-parse "refs/cb-remote/heads/$CB_DEFAULT")
          else
            CB_SHA="absent"
          fi

          echo "GitHub $GH_DEFAULT: $GH_SHA"
          echo "Codeberg $CB_DEFAULT: $CB_SHA"

          # ---- 3. decide direction ----
          if [ "$GH_SHA" = "$CB_SHA" ]; then
            echo "✅ Already in sync at $GH_SHA — nothing to do."
            exit 0
          fi

          if [ "$CB_SHA" = "absent" ] || git merge-base --is-ancestor "$CB_SHA" "$GH_SHA"; then
            echo "→ GitHub ahead (or Codeberg empty). Mirroring GH → Codeberg."
            git push --mirror cb
          elif git merge-base --is-ancestor "$GH_SHA" "$CB_SHA"; then
            echo "← Codeberg ahead. Pushing Codeberg refs → GitHub (force-with-lease)."
            # Default branch
            git push origin \
              "refs/cb-remote/heads/$CB_DEFAULT:refs/heads/$GH_DEFAULT" \
              --force-with-lease
            # Other branches
            git push origin 'refs/cb-remote/heads/*:refs/heads/*' --force-with-lease || true
            # Tags
            git push origin 'refs/cb-remote/tags/*:refs/tags/*' --force-with-lease || true
          else
            echo "::error::GitHub and Codeberg default branches have diverged. Resolve manually, then re-run this workflow."
            exit 1
          fi
